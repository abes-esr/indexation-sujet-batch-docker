#
# Ci-dessous la config qui permet de lancer indexation-sujet-batch-dump
#
# Remarque: avant de lancer docker-compose up, il faut régler le fichier .env
# en partant du fichier .env-dist qui donne les variables d'environnements
# à personnaliser et des exemples de valeurs.
#

services:

indexation-sujet-batch-dump:
    image: abesesr/indexation-sujet:${INDEXATION_SUJET_BATCH_DUMP_VERSION}
    container_name: indexation-sujet-batch-dump
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    environment:   
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
      INDEXATION_SUJET_BATCH_AT_STARTUP: ${INDEXATION_SUJET_BATCH_AT_STARTUP}

      INDEXATION_SUJET_BATCH_OUTPUT_DIR: ${INDEXATION_SUJET_BATCH_OUTPUT_DIR}
      INDEXATION_SUJET_BATCH_OUTPUT_FILENAME: ${INDEXATION_SUJET_BATCH_OUTPUT_FILENAME}
      INDEXATION_SUJET_BATCH_VECTORIZATION_URL: ${INDEXATION_SUJET_BATCH_VECTORIZATION_URL}
      INDEXATION_SUJET_BATCH_CHUNK_SIZE: ${INDEXATION_SUJET_BATCH_CHUNK_SIZE}
      INDEXATION_SUJET_BATCH_SOURCE_TABLE: ${INDEXATION_SUJET_BATCH_SOURCE_TABLE}

      INDEXATION_SUJET_ORACLE_HOST: ${INDEXATION_SUJET_ORACLE_HOST}
      INDEXATION_SUJET_ORACLE_PORT: ${INDEXATION_SUJET_ORACLE_PORT}
      INDEXATION_SUJET_ORACLE_SERVICE: ${INDEXATION_SUJET_ORACLE_SERVICE}
      INDEXATION_SUJET_ORACLE_USER: ${INDEXATION_SUJET_ORACLE_USER}
      INDEXATION_SUJET_ORACLE_PASSWORD: ${INDEXATION_SUJET_ORACLE_PASSWORD}

      INDEXATION_SUJET_BATCH_TEST_OUTPUT_DIR: ${INDEXATION_SUJET_BATCH_TEST_OUTPUT_DIR}
      INDEXATION_SUJET_BATCH_TEST_PROCEDURE_FILENAME: ${INDEXATION_SUJET_BATCH_TEST_PROCEDURE_FILENAME}
      INDEXATION_SUJET_BATCH_TEST_REQUETE_FILENAME: ${INDEXATION_SUJET_BATCH_TEST_REQUETE_FILENAME}
      INDEXATION_SUJET_BATCH_TEST_SOURCE_TABLE: ${INDEXATION_SUJET_BATCH_TEST_SOURCE_TABLE}
      INDEXATION_SUJET_BATCH_TEST_CHUNK_SIZE: ${INDEXATION_SUJET_BATCH_TEST_CHUNK_SIZE}

      INDEXATION_SUJET_ORACLE_TEST_HOST: ${INDEXATION_SUJET_ORACLE_TEST_HOST}
      INDEXATION_SUJET_ORACLE_TEST_PORT: ${INDEXATION_SUJET_ORACLE_TEST_PORT}
      INDEXATION_SUJET_ORACLE_TEST_SERVICE: ${INDEXATION_SUJET_ORACLE_TEST_SERVICE}
      INDEXATION_SUJET_ORACLE_TEST_USER: ${INDEXATION_SUJET_ORACLE_TEST_USER}
      INDEXATION_SUJET_ORACLE_TEST_PASSWORD: ${INDEXATION_SUJET_ORACLE_TEST_PASSWORD}    
    labels:
      # pour envoyer les logs dans le puits de log de l'abes
      - "co.elastic.logs/enabled=true"
      - "co.elastic.logs/processors.add_fields.target="
      - "co.elastic.logs/processors.add_fields.fields.abes_appli=indexation-sujet"
      - "co.elastic.logs/processors.add_fields.fields.abes_middleware=java-spring"
      # pour que les mises à jour de cette image soient auto-déployées par wud
      - "wud.watch=true"
      - "wud.watch.digest=true"
